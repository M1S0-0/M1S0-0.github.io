<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a class="brand" href="/">m1s0</a>
    <div class="nav-links">
      <a href="/web2/">Web2</a>
      <a class="active" href="/web3/">Web3</a>
      <a href="/writeups/">Writeups</a>
      <a href="/tools/">Tools</a>
      <a href="/hall-of-fame/">Hall of Fame</a>
    </div>
  </div>
</nav>

<div class="wrap">

  <header class="page-head">
    <h1>Web3 Findings</h1>
    <p>Smart contract vulnerabilities from audits, public contests, and bug bounty programs. Accounting flaws, oracle manipulation, access control, and signature handling.</p>
  </header>

  <div class="stats" id="stats"></div>
  <div class="filters" id="filters"></div>
  <div class="cards" id="list"></div>

</div>

<footer class="foot">
  <div class="foot-links">
    <a href="https://github.com/M1S0-0" rel="noopener">GitHub</a>
    <a href="mailto:unknowbughunter@gmail.com">Email</a>
  </div>
  <small>&copy; 2026 M1S0</small>
</footer>

<script src="/assets/js/data/findings.js"></script>
<script src="/assets/js/data/halloffame.js"></script>
<script src="/assets/js/render.js"></script>
<script>
  var web3 = FINDINGS.filter(function (f) { return f.domain === "web3"; });

  (function () {
    var paid = web3.reduce(function (s, f) { return s + (f.bounty || 0); }, 0);
    var crit = web3.filter(function (f) { return f.severity === "Critical" || f.severity === "High"; }).length;
    var progs = {};
    web3.forEach(function (f) { progs[f.program] = 1; });
    document.getElementById("stats").innerHTML =
      '<div class="stat"><span class="num">' + web3.length + '</span><span class="lbl">Findings</span></div>' +
      '<div class="stat"><span class="num">' + (paid ? "$" + paid.toLocaleString("en-US") : "—") + '</span><span class="lbl">Bounties</span></div>' +
      '<div class="stat"><span class="num">' + crit + '</span><span class="lbl">Critical / High</span></div>' +
      '<div class="stat"><span class="num">' + Object.keys(progs).length + '</span><span class="lbl">Protocols</span></div>';
  })();

  renderFindings(web3, "list");
  initFilters("filters", "list", web3);
</script>

</body>
</html>
