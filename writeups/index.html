<div class="wrap">

  <header class="page-head">
    <h1>Writeups</h1>
    <p>How the bug was found, why the code was wrong, and what it took to prove it. Vulnerability research, exploitation, and the occasional CTF.</p>
  </header>

  <div class="filters" id="filters"></div>
  <div class="cards" id="list"></div>

<script src="/assets/js/data/writeups.js"></script>
<script src="/assets/js/render.js"></script>
<script>
  renderWriteups(WRITEUPS, "list");

  (function () {
    var bar = document.getElementById("filters");
    var cats = ["All", "web2", "web3", "research", "ctf"];
    bar.innerHTML = cats.map(function (c, i) {
      return '<button class="filter' + (i === 0 ? " on" : "") + '" data-cat="' + c + '">' + c + "</button>";
    }).join("");

    bar.addEventListener("click", function (e) {
      var btn = e.target.closest(".filter");
      if (!btn) return;
      Array.prototype.forEach.call(bar.querySelectorAll(".filter"), function (b) { b.classList.remove("on"); });
      btn.classList.add("on");
      var c = btn.getAttribute("data-cat");
      renderWriteups(c === "All" ? WRITEUPS : WRITEUPS.filter(function (w) { return w.domain === c; }), "list");
    });
  })();
</script>

</body>
